<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b57d0">
  <title>ALŞ08 – Web Arayüzü</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    body { font-family:system-ui; margin:0; padding:24px; max-width:860px;
           margin-left:auto; margin-right:auto; }
    h1 { margin-top: 0; }
    #qr { margin:16px auto; display:block; border-radius:12px; }
    #chat { border:1px solid #ccc; height:340px; overflow:auto; padding:8px;
            border-radius:8px; background:#fafafa; }
    .msg { padding:6px 10px; margin:4px 0; border-radius:8px; max-width:75%;
           word-break: break-word; }
    .me   { background:#e8f0fe; margin-left:auto; }
    .them { background:#f1f1f1; }
    #row { display:flex; gap:8px; margin-top:8px; align-items: center; }
    #row input[type=text] { flex:1; padding:10px; border-radius:8px; border:1px solid #ccc; }
    #row button, #row label { padding:10px 14px; border-radius:8px; border:none;
                              background:#0b57d0; color:#fff; font-weight:600; cursor:pointer; }
    #row label { display:inline-block; }
    #file { display:none; }
    progress { width:100%; height:16px; margin-top: 8px; }
    .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
    .top a { color:#0b57d0; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="top">
    <h1>ALŞ08 – Web Arayüzü</h1>
    <a href="../index.html">← Ana ekran</a>
  </div>
  <p id="status">Başlatılıyor…</p>
  <canvas id="qr"></canvas>
  <p>ID: <code id="peerid">—</code></p>

  <div id="chat"></div>
  <div id="row">
    <input type="text" id="msg" placeholder="Mesaj yazın…" disabled>
    <button id="send" disabled>Gönder</button>
    <label for="file">📎 Dosya</label>
    <input type="file" id="file" multiple disabled>
  </div>
  <progress id="prog" value="0" max="100" hidden></progress>

  <script type="module">
    import { setPendingId } from '../shared/bridge.js';
    import { formatBytes, appendMessage, appendFile } from '../shared/utils.js';

    const $ = id => document.getElementById(id);
    const CHUNK = 16 * 1024;

    let peer, conn;
    const incoming = new Map();

    peer = new Peer({ debug: 2 });

    peer.on('open', id => {
      $('peerid').textContent = id;
      $('status').textContent = 'QR kodu telefonunuzla okutun.';
      QRCode.toCanvas($('qr'), `als10://id=${id}`, { width: 240 },
        err => err && console.error(err));
      // Aynı ID'yi ALŞ09 için de köprüye yaz (kolaylık)
      setPendingId(id, 'hoca');
    });

    peer.on('connection', c => {
      if (conn) { c.close(); return; }
      conn = c;
      $('status').textContent = 'Bağlantı kuruldu!';
      $('qr').hidden = true;
      $('msg').disabled = false;
      $('send').disabled = false;
      $('file').disabled = false;

      conn.on('data', handleData);
      conn.on('close', () => {
        $('status').textContent = 'Bağlantı kapandı.';
        $('msg').disabled = $('send').disabled = $('file').disabled = true;
      });
    });

    $('send').onclick = () => {
      const t = $('msg').value.trim();
      if (!t || !conn) return;
      conn.send({ type: 'text', text: t });
      appendMessage($('chat'), t, 'me');
      $('msg').value = '';
    };
    $('msg').addEventListener('keydown', e => e.key === 'Enter' && $('send').click());

    $('file').onchange = async () => {
      if (!conn) return;
      for (const f of $('file').files) await sendFile(f);
      $('file').value = '';
    };

    async function sendFile(file) {
      const id = crypto.randomUUID();
      conn.send({ type: 'file-start', id, name: file.name, mime: file.type, size: file.size });
      const reader = file.stream().getReader();
      let sent = 0;
      $('prog').hidden = false; $('prog').value = 0;
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        for (let off = 0; off < value.byteLength; off += CHUNK) {
          const slice = value.subarray(off, off + CHUNK);
          conn.send({ type: 'file-chunk', id, data: slice });
          sent += slice.byteLength;
        }
        $('prog').value = Math.round((sent / file.size) * 100);
      }
      conn.send({ type: 'file-end', id });
      appendMessage($('chat'), `📎 ${file.name} (${formatBytes(file.size)}) gönderildi`, 'me');
      $('prog').hidden = true;
    }

    function handleData(data) {
      if (typeof data !== 'object') return;
      switch (data.type) {
        case 'text':
          appendMessage($('chat'), data.text, 'them'); break;
        case 'file-start':
          incoming.set(data.id, { meta: data, chunks: [] }); break;
        case 'file-chunk': {
          const r = incoming.get(data.id);
          if (r) r.chunks.push(data.data);
          break;
        }
        case 'file-end': {
          const r = incoming.get(data.id);
          if (!r) break;
          const blob = new Blob(r.chunks, { type: r.meta.mime || 'application/octet-stream' });
          appendFile($('chat'), blob, r.meta.name, r.meta.mime, 'them');
          incoming.delete(data.id);
          break;
        }
      }
    }
  </script>
</body>
</html>
