<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b57d0">
  <title>ALŞ08 – Mobil Arayüzü</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body { font-family:system-ui; margin:0; padding:16px; }
    video { width:100%; border-radius:12px; }
    #chat { border:1px solid #ccc; height:280px; overflow:auto; padding:8px;
            border-radius:8px; background:#fafafa; }
    .msg { padding:6px 10px; margin:4px 0; border-radius:8px; max-width:80%;
           word-break: break-word; }
    .me   { background:#e8f0fe; margin-left:auto; }
    .them { background:#f1f1f1; }
    #row { display:flex; gap:8px; margin-top:8px; }
    #row input[type=text] { flex:1; padding:10px; border-radius:8px; border:1px solid #ccc; }
    button, label.btn { padding:10px 14px; border-radius:8px; border:none;
                        background:#0b57d0; color:#fff; font-weight:600; cursor:pointer;
                        display:inline-block; }
    #file { display:none; }
    .top { display:flex; justify-content:space-between; align-items:center; }
    .top a { color:#0b57d0; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="top">
    <h2 style="margin:0;">ALŞ08 – Mobil</h2>
    <a href="../index.html">← Ana</a>
  </div>
  <p id="status">Kamera hazır değil.</p>
  <video id="cam" autoplay playsinline muted hidden></video>
  <canvas id="qrframe" hidden></canvas>
  <button id="scanBtn">📷 Kamera ile QR Okut</button>

  <div id="chat" hidden></div>
  <div id="row" hidden>
    <input type="text" id="msg" placeholder="Mesaj…">
    <button id="send">Gönder</button>
    <label class="btn" for="file">📎</label>
    <input type="file" id="file" multiple>
  </div>

  <script type="module">
    import { parseIdFromQr, setPendingId } from '../shared/bridge.js';
    import { formatBytes, appendMessage, appendFile } from '../shared/utils.js';

    const $ = id => document.getElementById(id);
    const CHUNK = 16 * 1024;
    const incoming = new Map();

    let peer, conn;

    $('scanBtn').onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }, audio: false
        });
        $('cam').srcObject = stream;
        $('cam').hidden = false;
        $('status').textContent = 'QR kodu bilgisayar ekranına tutun…';
        requestAnimationFrame(tick);
      } catch (e) {
        $('status').textContent = 'Kamera açılamadı: ' + e.message;
      }
    };

    function tick() {
      const cam = $('cam'), frame = $('qrframe');
      if (cam.readyState < 2) return requestAnimationFrame(tick);
      if (frame.width !== cam.videoWidth) {
        frame.width = cam.videoWidth; frame.height = cam.videoHeight;
      }
      const ctx = frame.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(cam, 0, 0);
      const img = ctx.getImageData(0, 0, frame.width, frame.height);
      const code = jsQR(img.data, img.width, img.height);
      if (code) {
        const id = parseIdFromQr(code.data);
        if (id) {
          // Köprüye de yaz → ALŞ09 öğrenci modu otomatik doldurur
          setPendingId(id, 'hoca');
          connectToPeer(id);
          return;
        }
      }
      requestAnimationFrame(tick);
    }

    function connectToPeer(id) {
      if (peer) return;
      $('status').textContent = 'Bağlanılıyor: ' + id;
      peer = new Peer({ debug: 2 });
      peer.on('open', () => {
        conn = peer.connect(id, { reliable: true });
        conn.on('open', () => {
          $('status').textContent = 'Bağlı!';
          $('chat').hidden = false;
          $('row').hidden = false;
          $('cam').srcObject?.getTracks().forEach(t => t.stop());
          $('cam').hidden = true;
          $('scanBtn').hidden = true;
        });
        conn.on('data', handleData);
      });
      peer.on('error', err => {
        $('status').textContent = 'Hata: ' + err.type;
      });
    }

    $('send').onclick = () => {
      const t = $('msg').value.trim();
      if (!t || !conn) return;
      conn.send({ type: 'text', text: t });
      appendMessage($('chat'), t, 'me');
      $('msg').value = '';
    };

    $('file').onchange = async () => {
      if (!conn) return;
      for (const f of $('file').files) await sendFile(f);
      $('file').value = '';
    };

    async function sendFile(file) {
      const id = crypto.randomUUID();
      conn.send({ type: 'file-start', id, name: file.name, mime: file.type, size: file.size });
      const reader = file.stream().getReader();
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        for (let off = 0; off < value.byteLength; off += CHUNK) {
          conn.send({ type: 'file-chunk', id, data: value.subarray(off, off + CHUNK) });
        }
      }
      conn.send({ type: 'file-end', id });
      appendMessage($('chat'), `📎 ${file.name} (${formatBytes(file.size)}) gönderildi`, 'me');
    }

    function handleData(data) {
      if (typeof data !== 'object') return;
      switch (data.type) {
        case 'text':
          appendMessage($('chat'), data.text, 'them'); break;
        case 'file-start':
          incoming.set(data.id, { meta: data, chunks: [] }); break;
        case 'file-chunk': {
          const r = incoming.get(data.id);
          if (r) r.chunks.push(data.data);
          break;
        }
        case 'file-end': {
          const r = incoming.get(data.id);
          if (!r) break;
          const blob = new Blob(r.chunks, { type: r.meta.mime || 'application/octet-stream' });
          appendFile($('chat'), blob, r.meta.name, r.meta.mime, 'them');
          incoming.delete(data.id);
          break;
        }
      }
    }
  </script>
</body>
</html>
