<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b57d0">
  <title>ALŞ10 – Birleşik PWA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/192.png">
  <style>
    :root { color-scheme: light dark; --brand:#0b57d0; --brand-bg:#e8f0fe; }
    @media (prefers-color-scheme: dark) { :root { --brand:#cfe0ff; --brand-bg:#1a3a6b; } }
    body { font-family: system-ui, sans-serif; margin:0;
           padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
           background: Canvas; color: CanvasText; }
    h1 { text-align:center; max-width:720px; margin: 8px auto 24px; }
    .hub { display:grid; gap:16px; max-width:720px; margin:0 auto; }
    .card { display:flex; align-items:center; gap:16px; padding:20px 24px;
            border-radius:16px; text-decoration:none; background:var(--brand-bg);
            color:var(--brand); font-size:1.05rem; font-weight:600;
            min-height:88px; transition:transform .12s ease; }
    .card:active { transform:scale(.98); }
    .card .emoji { font-size:1.8rem; }
    .card small { display:block; font-weight:400; font-size:.85rem; opacity:.75; margin-top:4px; }
  </style>
</head>
<body>
  <h1>ALŞ10 – Birleşik PWA</h1>
  <main class="hub">
    <a class="card" href="al08/desktop.html">
      <span class="emoji">💻</span>
      <span>ALŞ08 – Web Arayüzü
        <small>QR üret · P2P sohbet & dosya transferi</small></span>
    </a>
    <a class="card" href="al08/mobile.html">
      <span class="emoji">📱</span>
      <span>ALŞ08 – Mobil Arayüzü
        <small>QR okut · P2P sohbet & dosya transferi</small></span>
    </a>
    <a class="card" href="al09/index.html">
      <span class="emoji">🎓</span>
      <span>ALŞ09 – Hoca / Öğrenci
        <small>Toplu dosya dağıtımı · QR ile otomatik ID</small></span>
    </a>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }
  </script>
</body>
</html>
